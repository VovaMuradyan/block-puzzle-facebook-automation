<!DOCTYPE html>
<html lang="en">
<head>

  <style>

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff007f, #7928ca);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin: 0 auto 15px;
      box-shadow: 0 8px 25px rgba(255, 0, 127, 0.4);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    .game-card {
      display: block;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      transition: transform 0.2s ease, background 0.2s ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
    .game-card:hover, .game-card:active {
      transform: translateY(-3px) scale(1.02);
      background: rgba(255, 255, 255, 0.15);
    }
    .btn-block {
      background: linear-gradient(135deg, #ff9500, #ff2d55);
      border-color: #ff9500;
    }
    .btn-flappy {
      background: linear-gradient(135deg, #007aff, #5856d6);
      border-color: #007aff;
    }
    .game-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .game-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }
    .download-badge {
      display: inline-block;
      margin-top: 10px;
      background: #000;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    footer {

</head>
<body>
  <div class="container">
